<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network diagnostics</title>
<style>body{font:16px system-ui;max-width:760px;margin:48px auto;padding:20px;background:#f4f7fb;color:#172033}label{display:block;margin:18px 0}input,button{font:inherit;padding:10px}pre{white-space:pre-wrap;background:white;padding:20px;border-radius:12px}</style></head>
<body><h1>Network diagnostics</h1><p>Run a single-port Nmap check for an IPv4 host you are authorized to test. Nmap must be installed on the server.</p>
<form id="diagnostics"><label>IPv4 address <input id="ip" name="ip" value="127.0.0.1" required></label><label>Port <input id="port" name="port" type="number" min="1" max="65535" value="80" required></label><button id="submit">Run check</button></form>
<pre id="output" aria-live="polite">Results will appear here.</pre>
<script>
document.getElementById('diagnostics').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.getElementById('submit');
  const output = document.getElementById('output');
  button.disabled = true;
  output.textContent = 'Running check...';
  try {
    const response = await fetch('/CgiTool', {method: 'POST', headers: {'Content-Type': 'application/x-www-form-urlencoded'}, body: new URLSearchParams(new FormData(event.currentTarget))});
    if (!response.ok) throw new Error(`Check failed (HTTP ${response.status}).`);
    output.textContent = await response.text();
  } catch (error) { output.textContent = error.message; }
  finally { button.disabled = false; }
});
</script></body></html>
