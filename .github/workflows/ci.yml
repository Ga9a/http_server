name: Build and HTTP regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build && cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python3 tests_smoke.py
      - run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev
      - run: cmake -S . -B build-mysql -DENABLE_MYSQL_CGI=ON && cmake --build build-mysql --parallel 2
